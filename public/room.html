<!DOCTYPE html>
<html>
<head>
    <title>Concours Dactylo YMCA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e0e0e0;
            color: #222;
        }

        * {
            user-select: none;
        }

        header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            background-color:#1f1f1f;
            padding:10px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 2px solid #b20000;
        }

        header img {
            height:50px;
        }

        #texte {
            font-weight:bold;
            font-size:18px;
            margin:20px 0;
            color:#000;
            background-color:#fff;
            padding:15px;
            border-radius:12px;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        }

        textarea {
            width:100%;
            height:140px;
            font-size:18px;
            padding:10px;
            border:2px solid #888;
            border-radius:12px;
            background-color:#f9f9f9;
            color:#222;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            resize:none;
        }

        .progress {
            height:30px;
            margin-bottom:10px;
            background-color:#ccc;
            border-radius:12px;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2);
        }

        .progress-bar {
            font-weight:bold;
            line-height:30px;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        .label-progress {
            font-weight:bold;
            margin-bottom:5px;
            color:#222;
        }

        #playersContainer {
            margin-top:20px;
        }

        .player-bar {
            margin-bottom:15px;
        }

        .container {
            max-width:900px;
        }

        #leaveBtn {
            width:100%;
            margin-top:15px;
        }

        .modal-content.bg-success {
            background-color:#4caf50 !important;
        }

        .modal-content.bg-danger {
            background-color:#f44336 !important;
        }

        .modal-title, .modal-body {
            color:#fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <header>
        <img src="/assets/logo/logo no fond.svg" alt="Logo gauche">
        <img src="/assets/logo/Logo_YMCA_HD.png" alt="Logo droite">
    </header>

<div class="container mt-4">
    <h1 class="text-center mb-4" style="color:#b20000; text-shadow:1px 1px 2px rgba(0,0,0,0.3);">Y-tech TypeRush <i class="fas fa-keyboard text-dark"></i></h1>

    <p id="texte"></p>

    <div class="mb-3">
        <label for="input" class="form-label label-progress">Votre saisie :</label>
        <textarea id="input" class="form-control" placeholder="Tapez le texte ci-dessus..." disabled></textarea>
    </div>

    <div id="playersContainer"></div>

    <button id="leaveBtn" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i> Quitter la room</button>
</div>

<div class="modal fade" id="resultModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Résultat</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const texteElement = document.getElementById("texte");
const input = document.getElementById("input");
const playersContainer = document.getElementById("playersContainer");
const leaveBtn = document.getElementById("leaveBtn");
const resultModal = new bootstrap.Modal(document.getElementById("resultModal"));
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");

const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get("roomId");
const isHost = urlParams.get("host") === "true";

let clientId = localStorage.getItem("clientId");
let playerName = localStorage.getItem("playerName") || "Joueur";
let level = localStorage.getItem("level") || "expert";
let startTime = null;
let typedCharsTotal = 0;
let texte = localStorage.getItem("roomTexte") || "";

function joinRoom(){
    if(isHost){
        socket.emit("createRoom",{roomId, level, name:playerName, clientId});
    } else {
        socket.emit("joinRoom",{roomId, name:playerName, clientId});
    }
}
joinRoom();

if(texte){
    texteElement.innerText = texte;
    input.disabled = false;
    input.focus();
}

socket.on("texteCommun",(txt)=>{
    texte = txt;
    texteElement.innerText = texte;
    input.disabled = false;
    input.focus();
});

leaveBtn.addEventListener("click", ()=>{
    socket.emit("leaveRoom",{roomId, clientId});
    window.location.href = "index.html";
});

input.addEventListener("input", ()=>{
    if(!startTime) startTime = Date.now();
    
    const typed = input.value;
    typedCharsTotal = typed.length;

    let correctChars = 0;
    for(let i=0;i<typed.length;i++){
        if(typed[i]===texte[i]) correctChars++;
        else break;
    }
    const progress = Math.floor((correctChars/texte.length)*100);

    const elapsedMinutes = (Date.now() - startTime)/60000;
    const cpm = elapsedMinutes>0 ? Math.floor(typedCharsTotal/elapsedMinutes) : 0;

    const errors = typed.length - correctChars;

    socket.emit("progress",{roomId, clientId, progress});
    socket.emit("speed",{roomId, clientId, cpm});

    if(correctChars === texte.length){
        socket.emit("finished",{roomId, clientId, stats:{cpm, errors}});
    }
});

socket.on("playersUpdate",(players)=>{
    playersContainer.innerHTML = "";
    for(let id in players){
        const player = players[id];
        const barColor = (id===clientId) ? "bg-danger" : "bg-secondary";
        const speedText = player.cpm ? ` - ${player.cpm} CPM` : "";
        playersContainer.innerHTML += `
            <div class="player-bar">
                <div class="label-progress">${player.name} : ${player.progress}%${speedText}</div>
                <div class="progress">
                    <div class="progress-bar ${barColor}" role="progressbar" style="width:${player.progress}%">${player.progress}%</div>
                </div>
            </div>
        `;
    }

    input.disabled = Object.keys(players).length < 2;
    if(!input.disabled) input.focus();
});

socket.on("finishModal", (stats) => {
    modalTitle.innerText = "✅ Terminé !";
    modalBody.innerHTML = `
        Votre saisie est terminée.<br>
        CPM : ${stats.cpm || 0}<br>
        Nombre de fautes : ${stats.errors || 0}
    `;
    document.querySelector(".modal-content").classList.remove("bg-success","bg-danger");
    document.querySelector(".modal-content").classList.add("bg-success","text-white");
    resultModal.show();
});

socket.on("finalWinner", (winnerId) => {
    if(winnerId === clientId){
        modalTitle.innerText = "🎉 Vous êtes le vainqueur !";
        modalBody.innerText = "Bravo, vous avez le CPM le plus élevé !";
        document.querySelector(".modal-content").classList.remove("bg-danger");
        document.querySelector(".modal-content").classList.add("bg-success","text-white");
    } else {
        modalTitle.innerText = "🏁 Terminé";
        modalBody.innerText = "Le concours est terminé.";
        document.querySelector(".modal-content").classList.remove("bg-success");
        document.querySelector(".modal-content").classList.add("bg-danger","text-white");
    }
    resultModal.show();
});

socket.on("roomClosed", ()=>{
    alert("La room a été fermée.");
    window.location.href = "index.html";
});
</script>
</body>
</html>
