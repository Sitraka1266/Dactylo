<!DOCTYPE html>
<html>
<head>
    <title>Créer une room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<style>
    header {
        display:flex;
        justify-content:space-between;
        align-items:center;
        background-color:#1f1f1f;
        padding:10px 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        border-bottom: 2px solid #b20000;
    }

    header img {
        height:50px;
    }
</style>
<body>
    <header>
        <img src="assets/logo/logo no fond.svg" alt="Logo gauche">
        <img src="assets/logo/Logo_YMCA_HD.png" alt="Logo droite">
    </header>
<div class="container mt-5">
    <h2>Créer une room (Host)</h2>
    <div class="mb-3">
        <label>Pseudo :</label>
        <input type="text" id="playerName" class="form-control" placeholder="Votre pseudo">
    </div>
    <div class="mb-3">
        <label>Niveau :</label>
        <select id="level" class="form-select">
            <option value="debutant">Débutant</option>
            <option value="intermediaire">Intermédiaire</option>
            <option value="expert" selected>Expert</option>
        </select>
    </div>
    <button id="createBtn" class="btn btn-danger"><i class="fas fa-plus-circle"></i> Créer la room</button>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const createBtn = document.getElementById("createBtn");
const playerNameInput = document.getElementById("playerName");

let clientId = localStorage.getItem("clientId");
if(!clientId) {
    clientId = Date.now() + "-" + Math.floor(Math.random()*1000);
    localStorage.setItem("clientId", clientId);
}

createBtn.addEventListener("click", ()=>{
    const playerName = playerNameInput.value.trim() || "Hôte";
    localStorage.setItem("playerName", playerName);
    const level = document.getElementById("level").value;
    const roomId = "ROOM"+Math.floor(Math.random()*1000);

    socket.emit("createRoom",{roomId, level, name:playerName, clientId});

    socket.on("texteCommun",(txt)=>{
        localStorage.setItem("roomTexte", txt);
        localStorage.setItem("level", level);
        window.location.href = `room.html?roomId=${roomId}&host=true`;
    });
});
</script>
</body>
</html>
