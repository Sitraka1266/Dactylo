<!DOCTYPE html>
<html>
<head>
    <title>Rejoindre une room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            background-color:#1f1f1f;
            padding:10px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 2px solid #b20000;
        }

        header img {
            height:50px;
        }
    </style>
</head>
<body>
    <header>
        <img src="assets/logo/logo no fond.svg" alt="Logo gauche">
        <img src="assets/logo/Logo_YMCA_HD.png" alt="Logo droite">
    </header>
<div class="container mt-5">
    <h2>Rejoindre une room</h2>
    <div class="mb-3">
        <label>Pseudo :</label>
        <input type="text" id="playerName" class="form-control" placeholder="Votre pseudo">
    </div>
    <div id="roomsContainer" class="mt-4"></div>
    <button id="refreshRooms" class="btn btn-primary mt-3"><i class="fas fa-sync-alt"></i> Actualiser la liste</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const playerNameInput = document.getElementById("playerName");
const roomsContainer = document.getElementById("roomsContainer");
const refreshBtn = document.getElementById("refreshRooms");

let clientId = localStorage.getItem("clientId");
if(!clientId){
    clientId = Date.now() + "-" + Math.floor(Math.random()*1000);
    localStorage.setItem("clientId", clientId);
}

function refreshRooms(){
    socket.emit("getRooms");
}

refreshBtn.addEventListener("click", refreshRooms);
refreshRooms();

socket.on("roomsList", (rooms)=>{
    roomsContainer.innerHTML = "";
    if(rooms.length===0){
        roomsContainer.innerHTML = "<p>Aucune room disponible</p>";
        return;
    }

    rooms.forEach(r=>{
        const div = document.createElement("div");
        div.classList.add("mb-2","p-2","border","rounded");
        div.innerHTML = `
            Room: ${r.roomId} - Niveau: ${r.level} 
            <button class="btn btn-secondary btn-sm joinBtn"><i class="fas fa-sign-in-alt"></i> Rejoindre</button>
        `;
        const btn = div.querySelector(".joinBtn");
        btn.addEventListener("click", ()=>{
            const playerName = playerNameInput.value.trim() || "Joueur";
            localStorage.setItem("playerName", playerName);
            localStorage.setItem("level", r.level);
            window.location.href = `room.html?roomId=${r.roomId}`;
        });
        roomsContainer.appendChild(div);
    });
});
</script>
</body>
</html>
